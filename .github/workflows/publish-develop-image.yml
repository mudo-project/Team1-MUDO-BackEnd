name: Publish develop Docker image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-develop-docker-image
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish develop image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mudo-groupware-backend:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/mudo-groupware-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
