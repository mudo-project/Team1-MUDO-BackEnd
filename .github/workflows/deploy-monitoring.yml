name: Deploy monitoring stack

on:
  push:
    branches:
      - main
    paths:
      - "infra/monitoring/**"
      - "infra/alloy/**"
      - ".github/workflows/deploy-monitoring.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "검증 후 실제 모니터링 스택 배포 실행"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: mudo-monitoring-deploy
  cancel-in-progress: false

env:
  MONITORING_INSTANCE_TAG_NAME: mudo-prod-monitoring-1
  ALLOY_ECR_REPOSITORY: mudo-observability-alloy
  ALLOY_TASK_FAMILY: mudo-prod-alloy
  ALLOY_SERVICE_NAME: mudo-prod-alloy-daemon

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate docker-compose syntax
        working-directory: infra/monitoring
        run: |
          cat > .env.monitoring.ci <<'EOF'
          MONITORING_DOMAIN=ci-check.invalid
          GRAFANA_ADMIN_USER=ci-check
          GRAFANA_ADMIN_PASSWORD=ci-check-placeholder
          PROMETHEUS_RETENTION=15d
          OBSERVABILITY_DATA_DIR=/opt/mudo-observability/data
          EOF
          docker compose --env-file .env.monitoring.ci -f docker-compose.monitoring.yml config -q
          rm -f .env.monitoring.ci

      - name: Validate Alloy config syntax
        run: |
          docker run --rm -v "${{ github.workspace }}/infra/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.18.0 validate /etc/alloy/config.alloy

  deploy:
    needs: validate
    if: >-
      ${{
        vars.PRODUCTION_MONITORING_DEPLOY_ENABLED == 'true' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || inputs.deploy == true)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials with GitHub OIDC
        id: aws
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: mudo-monitoring-${{ github.run_id }}

      - name: Sync monitoring config to S3
        run: |
          aws s3 sync infra/monitoring "s3://${{ vars.MONITORING_CONFIG_BUCKET }}/infra-config/monitoring" \
            --delete \
            --exclude ".env.monitoring*" \
            --exclude "alertmanager/alertmanager.yml"

      - name: Deploy monitoring stack via SSM RunCommand
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.MONITORING_INSTANCE_TAG_NAME }}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "모니터링 인스턴스를 찾을 수 없습니다." >&2
            exit 1
          fi

          REMOTE_COMMANDS=$(cat <<EOF
          aws s3 sync s3://${{ vars.MONITORING_CONFIG_BUCKET }}/infra-config/monitoring /opt/mudo-observability/config --delete --exclude ".env.monitoring*" --exclude "alertmanager/alertmanager.yml"
          chmod +x /opt/mudo-observability/config/scripts/deploy-monitoring-stack.sh
          /opt/mudo-observability/config/scripts/deploy-monitoring-stack.sh
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "mudo-monitoring-deploy-${{ github.sha }}" \
            --parameters "commands=[$(jq -Rs '. as $s | ($s | split("\n") | map(select(length > 0)))' <<< "$REMOTE_COMMANDS")]" \
            --query 'Command.CommandId' --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "상태: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "SSM 명령이 시간 내에 끝나지 않았습니다." >&2
          exit 1

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Alloy image
        uses: docker/build-push-action@v7
        with:
          context: infra/alloy
          file: infra/alloy/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ALLOY_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=monitoring-alloy
          cache-to: type=gha,mode=max,scope=monitoring-alloy

      - name: Render Alloy task definition
        run: |
          jq \
            --arg execRole "arn:aws:iam::${{ steps.aws.outputs.aws-account-id }}:role/mudo-prod-alloy-task-execution-role" \
            --arg image "${{ steps.ecr.outputs.registry }}/${{ env.ALLOY_ECR_REPOSITORY }}:${{ github.sha }}" \
            '.executionRoleArn = $execRole | .containerDefinitions[0].image = $image' \
            infra/alloy/task-definition.template.json > /tmp/alloy-task-definition.json

      - name: Register Alloy task definition
        id: register-alloy
        run: |
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/alloy-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Create or update Alloy daemon service
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster mudo-prod-cluster --services "${{ env.ALLOY_SERVICE_NAME }}" \
            --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")

          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service \
              --cluster mudo-prod-cluster \
              --service "${{ env.ALLOY_SERVICE_NAME }}" \
              --task-definition "${{ steps.register-alloy.outputs.task_arn }}" \
              --force-new-deployment
          else
            aws ecs create-service \
              --cluster mudo-prod-cluster \
              --service-name "${{ env.ALLOY_SERVICE_NAME }}" \
              --task-definition "${{ steps.register-alloy.outputs.task_arn }}" \
              --scheduling-strategy DAEMON \
              --deployment-configuration "maximumPercent=100,minimumHealthyPercent=0"
          fi

          aws ecs wait services-stable --cluster mudo-prod-cluster --services "${{ env.ALLOY_SERVICE_NAME }}"
