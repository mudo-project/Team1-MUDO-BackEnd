name: Backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate infrastructure manifests
        run: |
          python -m pip install --disable-pip-version-check -r infra/requirements.txt
          python infra/scripts/test_deploy_production.py
          python infra/scripts/deploy_production.py --validate-only

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build application JAR
        run: ./gradlew clean bootJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon
