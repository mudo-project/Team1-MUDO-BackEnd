# 프론트 팀원이 백엔드 소스 없이 Docker Hub 이미지를 실행하는 구성이다.
name: mudo-groupware-integration

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?Set LOCAL_MYSQL_ROOT_PASSWORD in .env.backend}
      MYSQL_DATABASE: mudo_groupware
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.backend}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.backend}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mudo-integration-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - mudo-integration-network

  app:
    # develop 머지 시 CI가 게시한 이미지를 받는다. 백엔드 소스와 Java는 필요하지 않다.
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env.backend}
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mudo_groupware?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.backend}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.backend}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.backend}
      WEBSOCKET_ALLOWED_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mudo-integration-network

volumes:
  # 프론트 팀원 PC에만 존재하며 다른 팀원과 공유되지 않는다.
  mudo-integration-mysql-data:

networks:
  mudo-integration-network:
    driver: bridge
