spring:
  application:
    name: mudo-groupware
  profiles:
    active: local
    group:
      prod:
        - mailgun
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  tomcat:
    mbeanregistry:
      # Tomcat 스레드풀·글로벌 요청 처리량(바이트) 메트릭은 Tomcat의 JMX MBean에서 값을 읽어오는데,
      # 기본값(false)이면 이 MBean 자체가 등록되지 않아 tomcat_threads_*, tomcat_global_* 메트릭이
      # /actuator/prometheus에 아예 안 잡힌다. local/prod 둘 다 항상 켜져 있어야 해서 공통에 둔다.
      enabled: true

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

app:
  mail:
    from: ${MAIL_FROM:no-reply@mg.market-app.org}
    webhook-signing-key: ${MAILGUN_WEBHOOK_SIGNING_KEY:}
    api-base-url: ${MAILGUN_API_BASE_URL:https://api.mailgun.net}
    domain: ${MAILGUN_DOMAIN:mg.market-app.org}
    api-key: ${MAILGUN_API_KEY:}
    connect-timeout: ${MAILGUN_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${MAILGUN_READ_TIMEOUT:PT10S}
    sending-timeout: ${MAIL_SENDING_TIMEOUT:PT15M}
    dispatch-batch-size: ${MAIL_DISPATCH_BATCH_SIZE:20}
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    retry-base-delay: ${MAIL_RETRY_BASE_DELAY:PT1M}
    retry-max-delay: ${MAIL_RETRY_MAX_DELAY:PT30M}
    reconcile-after: ${MAIL_RECONCILE_AFTER:PT10M}
    reconcile-cooldown: ${MAIL_RECONCILE_COOLDOWN:PT5M}
  instance:
    tenant-id: ${TENANT_ID:local}
    plan: ${TENANT_PLAN:local}
    deployment-sha: ${DEPLOYMENT_SHA:local}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:40}
    keep-alive-seconds: ${APP_ASYNC_KEEP_ALIVE_SECONDS:60}
    await-termination-seconds: ${APP_ASYNC_AWAIT_TERMINATION_SECONDS:30}
  heavy-job:
    max-concurrency: ${APP_HEAVY_JOB_MAX_CONCURRENCY:2}
  revenue-report:
    batch-cron: "${REVENUE_REPORT_BATCH_CRON:0 30 0 1 * *}"
    ai:
      base-url: ${REVENUE_REPORT_AI_BASE_URL:}
      generate-path: ${REVENUE_REPORT_AI_PATH:/api/revenue-report/generate}
      api-key: ${REVENUE_REPORT_AI_API_KEY:}
      connect-timeout-ms: ${REVENUE_REPORT_AI_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${REVENUE_REPORT_AI_READ_TIMEOUT_MS:15000}

platform:
  dashboard:
    enabled: ${PLATFORM_DASHBOARD_ENABLED:false}
    prometheus-url: ${PLATFORM_DASHBOARD_PROMETHEUS_URL:http://monitoring.mudo.internal:9090}
    tenant-registry-json: '${PLATFORM_DASHBOARD_TENANT_REGISTRY_JSON:[]}'
    tenant-directory-json: '${PLATFORM_TENANT_DIRECTORY_JSON:[]}'
