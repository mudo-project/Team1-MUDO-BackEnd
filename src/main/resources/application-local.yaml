spring:
  datasource:
    # IDE/gradle bootRun으로 앱만 직접 띄울 때 Docker Compose의 MySQL(호스트 포트 3307,
    # PC에 이미 있을 수 있는 로컬 3306과 충돌 방지)에 접속하기 위한 값이다. 컨테이너 안에서
    # 도는 앱은 docker-compose.local.yml이 이 값을 mysql:3306(내부 네트워크)으로 덮어쓴다.
    url: jdbc:mysql://localhost:${MYSQL_HOST_PORT:3307}/mudo_groupware?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:mudo_app}
    password: ${DB_PASSWORD:local-db-password-2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
