spring:
  datasource:
    # IDE/gradle bootRun으로 앱만 직접 띄울 때 Docker Compose의 MySQL(호스트 포트 3307,
    # PC에 이미 있을 수 있는 로컬 3306과 충돌 방지)에 접속하기 위한 값이다. 컨테이너 안에서
    # 도는 앱은 docker-compose.local.yml이 이 값을 mysql:3306(내부 네트워크)으로 덮어쓴다.
    url: jdbc:mysql://localhost:${MYSQL_HOST_PORT:3306}/mudo_groupware?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:mudo}
    password: ${DB_PASSWORD:mudo}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  payroll:
    statement:
      local-storage-path: ${PAYROLL_LOCAL_STORAGE_PATH:build/local-payroll-statements}

management:
  endpoints:
    web:
      exposure:
        # 로컬 monitoring/prometheus/prometheus.yml이 스크랩하는 /actuator/prometheus를 노출한다.
        # SecurityConfig에는 이미 permitAll로 등록돼 있어 별도 인증 설정은 필요 없다.
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        # http.server.requests의 p95/p99 히스토그램 버킷을 Prometheus로 내보낸다.
        http.server.requests: true
