spring:
  mail:
    username: ${MAILGUN_SMTP_USERNAME}
    password: ${MAILGUN_SMTP_PASSWORD}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    # 운영 마이그레이션은 일반 앱 시작이 아니라 별도 ECS Migration Task에서 실행한다.
    enabled: false
  jpa:
    show-sql: false

server:
  tomcat:
    threads:
      max: 60
      min-spare: 5
      max-queue-capacity: 100

app:
  client-ip:
    next-proxy:
      enabled: true
      signing-secret: ${CLIENT_IP_SIGNING_SECRET}
      max-clock-skew-seconds: ${CLIENT_IP_MAX_CLOCK_SKEW_SECONDS:60}
  mail:
    from: ${MAIL_FROM}
    webhook-signing-key: ${MAILGUN_WEBHOOK_SIGNING_KEY}
  instance:
    # 운영 Task에는 반드시 학원 식별자를 주입한다. 누락 시 애플리케이션 시작이 실패한다.
    tenant-id: ${TENANT_ID}
    plan: ${TENANT_PLAN}
    deployment-sha: ${DEPLOYMENT_SHA}

sentry:
  # DSN은 ECS Task Definition이 SSM SecureString에서만 주입한다.
  dsn: ${SENTRY_DSN:}
  environment: production
  release: ${DEPLOYMENT_SHA:unknown}
  send-default-pii: false
  traces-sample-rate: 0.0
  in-app-includes:
    - com.academy.mudogroupware
  tags:
    tenant: ${TENANT_ID}
    plan: ${TENANT_PLAN}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
