spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    # 운영 마이그레이션은 일반 앱 시작이 아니라 별도 ECS Migration Task에서 실행한다.
    enabled: false
  jpa:
    show-sql: false

server:
  tomcat:
    threads:
      max: 60
      min-spare: 5
      max-queue-capacity: 100

app:
  instance:
    # 운영 Task에는 반드시 학원 식별자를 주입한다. 누락 시 애플리케이션 시작이 실패한다.
    tenant-id: ${TENANT_ID}
    plan: ${TENANT_PLAN}
    deployment-sha: ${DEPLOYMENT_SHA}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
