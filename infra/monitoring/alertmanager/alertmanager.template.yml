global:
  resolve_timeout: 5m
  slack_api_url: "<SLACK_WEBHOOK_FROM_SSM>"

route:
  receiver: mudo-infra-slack
  group_by:
    - alertname
    - tenant
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: mudo-infra-slack
    slack_configs:
      - channel: "#mudo-infra-alerts"
        send_resolved: true
        title: "[{{ .Status }}] {{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.summary }}"
