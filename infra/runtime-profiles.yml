runtime_profiles:
  shared-default:
    # 결제 플랜과 무관하게 모든 학원에 적용하는 공통 런타임 상한이다.
    # 2026-08-18: academy-a/academy-d 모두 실트래픽 급증 시 컨테이너 메모리 사용률이
    # memory_reservation_mib 대비 99~100%까지 붙는 현상을 확인해 memory_reservation_mib/
    # memory_limit_mib를 상향했다. deploy_production.py의 용량 검사는 memory_reservation_mib
    # 기준으로 "현재 합 + 순차배포 여유 1개"를 cell-1의 80% 예산과 비교한다. 현재 활성 테넌트인
    # academy-a/d(둘 다 이 프로필) 기준 required_memory = 768*3 = 2304MiB, cell-1 예산은
    # ecs_registered_memory_mib(3826) * ecs_app_capacity_ratio(0.80) = 3060MiB이므로 여유가 있다.
    # 값 변경 시 infra/cells.yml의 실측 용량과 아래 산식을 다시 맞춰봐야 한다.
    cpu: 500
    memory_reservation_mib: 768
    memory_limit_mib: 1024
    tomcat_max_threads: 35
    tomcat_queue_capacity: 50
    hikari_max_pool_size: 10
    hikari_connection_timeout_ms: 3000
    async_core_pool_size: 1
    async_max_pool_size: 2
    async_queue_capacity: 20
    heavy_job_max_concurrency: 1
