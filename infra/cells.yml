cells:
  cell-1:
    ecs_cluster: mudo-prod-cluster
    capacity_provider: mudo-prod-capacity-provider
    rds_identifier: mudo-prod-rds-cell-1
    rds_app_connection_ratio: 0.70
    ecs_app_capacity_ratio: 0.80

    # AWS 리소스 생성 후 실제 값을 기록한다. null인 동안 운영 배포는 실패하도록 설계한다.
    # 2026-08-15 실측: academy-b/c는 다시 enabled: false(리허설 테넌트, 트래픽 없음)로
    # 전환했고, ASG도 desired 2대로 되돌렸다(academy-a/d만 라이브). 인스턴스 1대당
    # cpu 2048 / mem 1913 (t3.small) x 2대 = 4096/3826. ASG Max=4이므로 Managed
    # Scaling이 필요 시 늘어난다.
    ecs_registered_cpu: 4096
    ecs_registered_memory_mib: 3826
    rds_max_connections: 144
